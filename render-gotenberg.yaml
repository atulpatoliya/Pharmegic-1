# Deploy Gotenberg for Vercel-hosted Pharmegic portal
# https://render.com → New + → Blueprint → connect this repo → use this file
services:
  - type: web
    name: pharmegic-gotenberg
    runtime: image
    image:
      url: docker.io/gotenberg/gotenberg:8
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
